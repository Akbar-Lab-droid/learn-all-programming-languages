<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body { font-family: sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
    .card { background: white; border-radius: 16px; padding: 24px; width: 300px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .avatar { width: 96px; height: 96px; border-radius: 50%; background: #2563eb; color: white; font-size: 40px; line-height: 96px; margin: 0 auto; }
    .card h2 { margin: 12px 0 4px; }
    .card p { color: #666; margin: 0; }
    .card button { margin-top: 16px; background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">A</div>
    <h2>Akbar</h2>
    <p>Informatics Student &amp; Aspiring Developer</p>
    <button>Follow</button>
  </div>
</body>
</html>
