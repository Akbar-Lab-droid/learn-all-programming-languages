<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f0f4f8; }
    h1 { text-align: center; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 900px; margin: 0 auto; }
    .item { background: #2563eb; color: white; border-radius: 12px; height: 150px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    @media (max-width: 600px) { .gallery { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>My Gallery</h1>
  <div class="gallery">
    <div class="item">Photo 1</div>
    <div class="item">Photo 2</div>
    <div class="item">Photo 3</div>
    <div class="item">Photo 4</div>
    <div class="item">Photo 5</div>
    <div class="item">Photo 6</div>
  </div>
</body>
</html>
