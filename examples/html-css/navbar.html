<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
  <style>
    * { margin: 0; box-sizing: border-box; }
    body { font-family: sans-serif; }
    nav { background: #1a202c; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; }
    nav .logo { color: white; font-weight: bold; font-size: 20px; }
    nav ul { display: flex; list-style: none; gap: 24px; }
    nav a { color: #cbd5e0; text-decoration: none; }
    nav a:hover { color: white; }
    main { padding: 40px 24px; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">MySite</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </nav>
  <main>
    <h1>Welcome to MySite</h1>
    <p>This page has a navigation bar built with Flexbox.</p>
  </main>
</body>
</html>
